# A release: pushing a tag like v0.2.0-beta.1 builds NetMerge, signs it with the private release key and publishes it on
# GitHub (as a pre-release when the tag has a "-", such as -beta.1). The app finds new releases by the "versionCode: N"
# line in the notes (Updates.kt).
#
# The key lives only in the repository's encrypted secrets:
#   NETMERGE_KEYSTORE_B64      the keystore file, base64
#   NETMERGE_STORE_PASSWORD    its password
#   NETMERGE_KEY_ALIAS         the key's name in it
#   NETMERGE_KEY_PASSWORD      the key's password
# Keep a copy of the keystore and passwords safe outside GitHub: without them no update can install over this one.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # started by hand with a version: the release creates its tag
    inputs:
      version:
        description: "Version, e.g. 0.2.0-beta.1 (a dash makes it a pre-release)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: engine/go.mod
      - name: Version from the tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          [ -n "${{ github.event.inputs.version }}" ] && tag="v${{ github.event.inputs.version }}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          name="${tag#v}"
          # version code: one more than the newest release (or 3, after the test builds' 2)
          last=$(gh release list -R ${{ github.repository }} --limit 50 --json tagName,isDraft -q '.[] | select(.tagName|startswith("v")) | .tagName' | while read t; do
                   gh release view "$t" -R ${{ github.repository }} --json body -q .body | grep -o 'versionCode: *[0-9]*' | grep -o '[0-9]*'; done | sort -n | tail -1)
          code=$(( ${last:-2} + 1 ))
          echo "name=$name" >> $GITHUB_OUTPUT
          echo "code=$code" >> $GITHUB_OUTPUT
          case "$name" in *-*) echo "pre=--prerelease" >> $GITHUB_OUTPUT;; *) echo "pre=" >> $GITHUB_OUTPUT;; esac
          echo "version $name, code $code"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the engine (Go, gomobile)
        working-directory: engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind@latest
          go mod tidy
          go get golang.org/x/mobile/bind@latest
          go test ./split ./dnsblock
          gomobile init
          mkdir -p ../app/libs
          CGO_LDFLAGS="-Wl,-z,max-page-size=16384" gomobile bind -target=android/arm,android/arm64,android/amd64 -androidapi 29 -o ../app/libs/engine.aar ./mobile
      - name: The release key (from the encrypted secrets)
        env:
          KEY_B64: ${{ secrets.NETMERGE_KEYSTORE_B64 }}
        run: |
          [ -n "$KEY_B64" ] || { echo "the release key is not in the secrets (NETMERGE_KEYSTORE_B64)"; exit 1; }
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NETMERGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build and sign
        env:
          NETMERGE_STORE_PASSWORD: ${{ secrets.NETMERGE_STORE_PASSWORD }}
          NETMERGE_KEY_ALIAS: ${{ secrets.NETMERGE_KEY_ALIAS }}
          NETMERGE_KEY_PASSWORD: ${{ secrets.NETMERGE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease -PversionName=${{ steps.v.outputs.name }} -PversionCode=${{ steps.v.outputs.code }}
          mkdir -p out
          for abi in arm64-v8a universal; do
            cp app/build/outputs/apk/release/app-$abi-release.apk "out/NetMerge-${{ steps.v.outputs.tag }}-$abi.apk"
          done
          rm -f "$NETMERGE_KEYSTORE"
      - name: Check the signature (the private key, not the public test key)
        run: |
          AS=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" /usr/local/lib/android -name apksigner -path "*build-tools*" 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $AS"
          [ -n "$AS" ] || { echo "apksigner not found"; exit 1; }
          for f in out/*.apk; do
            echo "== $f"
            "$AS" verify --print-certs "$f" > cert.txt
            grep -E "certificate (DN|SHA-256)" cert.txt || true
            grep -q "CN=NetMerge Android test builds" cert.txt && { echo "$f is signed with the test key"; exit 1; }
            "$AS" verify "$f"
          done
          ( cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          NetMerge for Android ${{ steps.v.outputs.name }}: Wi-Fi and mobile data at the same time.

          **Install:** on the phone, open \`NetMerge-${{ steps.v.outputs.tag }}-arm64-v8a.apk\` (most phones; \`universal\` works on any)
          and allow your browser to install apps when Android asks. Later versions: NetMerge tells you, and Settings >
          About > Check for updates.

          If you installed a test build before, uninstall it once first: releases are signed with the release key.

          What is in it: see the README; how it was tested: docs/test-results.md.

          versionCode: ${{ steps.v.outputs.code }}
          EOF
          gh release create "${{ steps.v.outputs.tag }}" out/* -R ${{ github.repository }} ${{ steps.v.outputs.pre }} --target "${GITHUB_SHA}" \
            --title "NetMerge for Android ${{ steps.v.outputs.name }}" --notes-file notes.md

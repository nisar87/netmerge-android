name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the test-build pre-release below

jobs:
  emulator:
    # Android emulator with Wi-Fi and mobile data both available; checks that the app can keep both up and send a
    # connection out on each, also while it runs a VPN on the phone.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: engine/go.mod
      - name: Test and build the engine (Go, gomobile)
        working-directory: engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind@latest
          go mod tidy
          go get golang.org/x/mobile/bind@latest
          go vet ./split
          go test ./split
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 29 -o ../app/libs/engine.aar ./mobile
          ls -la ../app/libs
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its tests
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest :probe:assembleDebug :probe:assembleDebugAndroidTest
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell svc wifi enable
            adb shell svc data enable
            for i in $(seq 1 60); do d=$(adb shell dumpsys connectivity); w=$(echo "$d" | grep -c "ni{WIFI CONNECTED.*IS_VALIDATED"); m=$(echo "$d" | grep -c -E "ni\{MOBILE[^ ]* CONNECTED.*IS_VALIDATED"); [ "$w" -ge 1 ] && [ "$m" -ge 1 ] && break; [ $((i % 15)) -eq 0 ] && adb shell svc wifi disable && sleep 2 && adb shell svc wifi enable; sleep 3; done; echo "validated: wifi=$w mobile=$m after $i tries"
            adb shell dumpsys connectivity | grep -E "NetworkAgentInfo|Transports" | head -20 || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set dev.netmerge.android ACTIVATE_VPN allow
            adb logcat -c
            adb shell am instrument -w -r dev.netmerge.android.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt; cat instrument.txt
            grep -q "^OK (" instrument.txt || { echo "first try failed; networks now:"; adb shell dumpsys connectivity | grep "ni{" | cut -c1-200; sleep 20; adb shell am instrument -w -r dev.netmerge.android.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt; cat instrument.txt; }
            adb logcat -d -s NetMergeSpike > logcat.txt || true
            grep -q "^OK (" instrument.txt
            adb install -r probe/build/outputs/apk/debug/probe-debug.apk
            adb install -r probe/build/outputs/apk/androidTest/debug/probe-debug-androidTest.apk
            adb shell am start -n dev.netmerge.android/.MainActivity --ez merge true
            sleep 20
            adb shell dumpsys connectivity | grep -c "VPN CONNECTED" || true
            adb shell am instrument -w -r -e class dev.netmerge.probe.ProbeTest#pagesOpen dev.netmerge.probe.test/androidx.test.runner.AndroidJUnitRunner > probe1.txt; cat probe1.txt
            adb shell am instrument -w -r -e class dev.netmerge.probe.ProbeTest#download -e conns 8 -e secs 15 -e size 40000000 dev.netmerge.probe.test/androidx.test.runner.AndroidJUnitRunner > probe2.txt; cat probe2.txt
            sleep 3
            adb logcat -d -s NetMergeSpike NetMergeProbe GoLog > logcat.txt || true
            grep ENGINE logcat.txt | tail -5
            grep -q "^OK (" probe1.txt
            grep -q "^OK (" probe2.txt
            grep ENGINE logcat.txt | grep '"nets"' | tail -1 | sed 's/.*ENGINE //' | jq -e '[.nets[] | select(.rx > 100000)] | length >= 2'
            sh ci/dropout.sh
            adb shell am start -n dev.netmerge.android/.MainActivity; sleep 4; adb shell screencap -p /sdcard/screen-merging.png; adb pull /sdcard/screen-merging.png . || true
            adb shell am start -n dev.netmerge.android/.MainActivity --ez merge false; sleep 4; adb shell screencap -p /sdcard/screen-off.png; adb pull /sdcard/screen-off.png . || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-api${{ matrix.api }}
          path: |
            instrument.txt
            probe*.txt
            logcat.txt
            screen-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.api == 35
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            probe/build/outputs/apk/debug/probe-debug.apk
            probe/build/outputs/apk/androidTest/debug/probe-debug-androidTest.apk
          retention-days: 30

  test-build:
    # The test app for a real phone: kept on a pre-release named test-build, replaced on every push to main, so the
    # phone test can download it (it is a test build, not a release).
    needs: emulator
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: apks
      - name: Put the test app on the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find apks -name '*.apk' -exec cp {} . \;
          gh release delete test-build -R ${{ github.repository }} --yes --cleanup-tag || true
          gh release create test-build -R ${{ github.repository }} --prerelease --target ${{ github.sha }} \
            --title "Test build (not a release)" \
            --notes "Built from ${{ github.sha }} for testing on a real phone over USB. Not for daily use." \
            app-debug.apk app-debug-androidTest.apk probe-debug.apk probe-debug-androidTest.apk

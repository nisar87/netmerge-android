name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the test-build pre-release below

jobs:
  emulator:
    # Android emulator with Wi-Fi and mobile data both available; checks that the app can keep both up and send a
    # connection out on each, also while it runs a VPN on the phone.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: engine/go.mod
      - name: Test and build the engine (Go, gomobile)
        working-directory: engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind@latest
          go mod tidy
          go get golang.org/x/mobile/bind@latest
          go vet ./split
          go test ./split
          gomobile init
          mkdir -p ../app/libs
          # 16 KB memory pages (Google Play requires apps to support them): the engine's library must be aligned to 16 KB
          CGO_LDFLAGS="-Wl,-z,max-page-size=16384" gomobile bind -target=android/arm64,android/amd64 -androidapi 29 -o ../app/libs/engine.aar ./mobile
          ls -la ../app/libs
          mkdir -p /tmp/aar && unzip -o -q ../app/libs/engine.aar -d /tmp/aar
          for so in /tmp/aar/jni/*/libgojni.so; do
            al=$("$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -l "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            echo "$so LOAD alignment: $al"
            for v in $al; do case $v in 0x4000|0x10000) ;; *) echo "not aligned to 16 KB: $v"; exit 1;; esac; done
          done
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its tests
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest :app:assembleRelease :probe:assembleDebug :probe:assembleDebugAndroidTest && ls -la app/build/outputs/apk/debug app/build/outputs/apk/release
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            sh ci/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-api${{ matrix.api }}
          path: |
            instrument.txt
            probe*.txt
            logcat.txt
            screen-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.api == 35
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            probe/build/outputs/apk/debug/probe-debug.apk
            probe/build/outputs/apk/androidTest/debug/probe-debug-androidTest.apk
          retention-days: 30

  test-build:
    # The test app for a real phone: kept on a pre-release named test-build, replaced on every push to main, so the
    # phone test can download it (it is a test build, not a release). A run started by hand on another branch puts its
    # build on test-build-branch instead, so a change can be tried on the phone before it is merged.
    needs: emulator
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: apks
      - name: Put the test app on the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/main' && 'test-build' || 'test-build-branch' }}
        run: |
          find apks -name '*.apk' -exec cp {} . \;
          gh release delete $TAG -R ${{ github.repository }} --yes --cleanup-tag || true
          gh release create $TAG -R ${{ github.repository }} --prerelease --target ${{ github.sha }} \
            --title "Test build (not a release)" \
            --notes "Built from ${{ github.ref_name }} ${{ github.sha }} for testing on a real phone over USB. Not for daily use." \
            app-arm64-v8a-release.apk app-universal-release.apk app-universal-debug.apk app-debug-androidTest.apk probe-debug.apk probe-debug-androidTest.apk
